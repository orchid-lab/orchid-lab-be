name: Docker CI

on:
  push:
    branches: [main]
jobs:
  ci-test:
    name: ✅ CI Test
    runs-on: [self-hosted]

    steps:
      - uses: actions/checkout@v4

      - name: 🧰 Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      - name: ➕ Export DOTNET PATH
        run: echo "${{ runner.temp }}/dotnet" >> $GITHUB_PATH
      - name: Check dotnet
        run: |
          which dotnet
          dotnet --info

      - name: 🔍 Restore
        working-directory: orchid-backend-net
        run: dotnet restore orchid-backend-net.sln

      - name: 🧪 Run Tests
        working-directory: orchid-backend-net
        run: |
          dotnet test orchid-backend-net.Tests/orchid-backend-net.Application.Tests.csproj \
            --configuration Release \
            --verbosity normal

      # 🔥 CLEANUP CI CACHE – QUAN TRỌNG
      - name: 🧹 Cleanup .NET & NuGet cache
        if: always()
        run: |
          echo "Cleaning NuGet cache..."
          dotnet nuget locals all --clear

          echo "Cleaning .NET SDK cache..."
          rm -rf ${{ runner.temp }}/dotnet

          echo "Cleanup done."


  build-image:
    name: 🛠️ Build Docker Image
    needs: ci-test
    runs-on:
      - self-hosted
      - dotnet 
    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 📂 Move to project root
        working-directory: orchid-backend-net
        run: ls -la

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Compose
        working-directory: orchid-backend-net
        run: docker compose build

  run-compose:
    name: 🚀 Run Docker Compose
    runs-on: [self-hosted,dotnet]
    needs: build-image
    environment: PRODUCTION
    env: 
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Docker Compose Up
        working-directory: orchid-backend-net
        env: 
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
        run: docker compose up -d

      - name: 📜 Show Service Status
        run: docker compose ps
        working-directory: orchid-backend-net

  show-logs:
    name: 📋 Show Logs
    runs-on: [self-hosted,dotnet]
    needs: run-compose

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: 📜 Docker Compose Logs
        run: docker compose logs orchid-backend-net.api
        working-directory: orchid-backend-net

  cleanup:
    name: 🧹 Clean Up
    runs-on: [self-hosted,dotnet]
    needs: show-logs

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4
      
      - name: 🧽 Prune Docker Images
        run: |
          docker image prune -af
          docker builder prune -af
